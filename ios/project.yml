# XcodeGen manifest — run `xcodegen generate` in ios/ on the Mac to produce
# StakDemo.xcodeproj (install with `brew install xcodegen`). See README.md
# for the manual-Xcode alternative.
name: StakDemo
options:
  bundleIdPrefix: com.stak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  StakDemo:
    type: application
    platform: iOS
    sources:
      - path: StakDemo
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stak.demo
        INFOPLIST_FILE: StakDemo/Info.plist
        GENERATE_INFOPLIST_FILE: false
